<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
    <title>Create Your Account - UrbanScope</title>
</head>
<body>

    <div class="main-container">
        
        <!-- LEFT PANEL: Image, Branding & Showcase -->
        <div class="showcase-panel">
            <img src="Urban.jpg" alt="UrbanScope Property" class="showcase-img" id="slideImage">
            <div class="overlay"></div>

            <div class="showcase-header">
                <div class="brand-badge">
                    <img src="logo.jpg" alt="Logo" class="logo-icon" onerror="this.style.display='none'">
                    <div class="brand-text">
                        <h1>UrbanScope</h1>
                        <h2>CD Miranda Realty</h2>
                    </div>
                </div>
            </div>

            <div class="cursive-tagline">
                Better Homes,<br>Brighter Futures
            </div>

            <div class="showcase-caption">
                <h2 id="slideTitle">Your Next Home is<br>Just a Click away</h2>
                <p id="slideDesc">Access property details, submit inquiries, upload your requirements, and track your journey.</p>
                
                <div class="dots-container">
                    <button class="dot active" type="button" aria-label="Slide 1"></button>
                    <button class="dot" type="button" aria-label="Slide 2"></button>
                    <button class="dot" type="button" aria-label="Slide 3"></button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Register Form -->
        <div class="form-panel">
            <div class="form-wrapper">
                
                <div class="welcome-header">
                    <h1>Create Your Account</h1>
                    <p>It only takes a few minutes.</p>
                </div>

                <form action="register.php" method="POST" class="auth-form">
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <div class="input-box">
                            <input type="text" id="fullname" name="fullname" placeholder="e.g. Juan Dela Cruz" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-box">
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-box">
                            <input type="tel" id="phone" name="phone" placeholder="+639xxxxxxxxx" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-box">
                            <input type="password" id="password" name="password" placeholder="Create a Password" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <div class="input-box">
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" style="margin-top: 10px;">Create Account</button>
                </form>

                <div class="register-prompt" style="margin-top: 24px;">
                    <span>Already have an account?</span>
                    <a href="login.html">Log in</a>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
